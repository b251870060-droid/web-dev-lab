<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миний гэрэл зургийн ертөнц - Lab 4</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>

    <!-- Header & Navigation (Flexbox) -->
    <header class="site-header">
        <div class="logo">📸 My Photography</div>
        <nav class="nav-bar">
            <a href="#">Нүүр</a>
            <a href="#">Галерей</a>
            <a href="#">Миний тухай</a>
            <a href="#contact">Холбоо барих</a>
        </nav>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Sidebar: Унадаг (dropdown) ангиллын цэс -->
        <aside class="sidebar">
            <details open>
                <summary><h3> Ангилал</h3></summary>
                <ul>
                    <li><a href="#">🌄 Байгаль</a></li>
                    <li><a href="#">👤 Хөрөг зураг</a></li>
                    <li><a href="#">🏙️ Гудамжны хэмнэл</a></li>
                    <li><a href="#">🏛️ Архитектур</a></li>
                </ul>
            </details>
            
            
        </aside>

        <!-- Main Content (Зургийн грид галерей) -->
        <main class="content">
            <h2>Миний авсан зургууд</h2>
            <div class="grid-gallery">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500" alt="Байгаль">
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Хөрөг">
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?w=500" alt="Гудамж">
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=500" alt="Архитектур">
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=500" alt="Аялал">
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=500" alt="Ан амьтан">
                </div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 Гэрэл зургийн портфолио. Лаборатори 4 - Flexbox & Grid Layout.</p>
    </footer>

</body>
</html>
